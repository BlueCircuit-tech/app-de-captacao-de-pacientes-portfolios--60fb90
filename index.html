<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rehabi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            marca: {
              50: '#f4f7f0', 100: '#e6eedb', 200: '#cddcb7', 300: '#a8c48a',
              400: '#7daa5c', 500: '#5d8c3d', 600: '#4a7530', 700: '#38571A',
              800: '#2d4515', 900: '#213810'
            },
            destaque: {
              50: '#fef9f0', 100: '#fdf0d5', 200: '#fae0aa', 300: '#f6ca75',
              400: '#f2b344', 500: '#D38301', 600: '#b87201', 700: '#995e01',
              800: '#7d4c01', 900: '#613c01'
            }
          },
          fontFamily: { display: ['"Playfair Display"', 'Georgia', 'serif'], body: ['"DM Sans"', 'system-ui', 'sans-serif'] },
          boxShadow: { marca: '0 4px 24px -6px rgba(56,87,26,0.25)', 'marca-lg': '0 12px 40px -10px rgba(56,87,26,0.35)', card: '0 1px 8px rgba(0,0,0,0.06)' },
          borderRadius: { '2xl': '1rem', '3xl': '1.5rem' }
        }
      }
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; overscroll-behavior: none; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: #1a1a1e; display: flex; justify-content: center; align-items: center; min-height: 100dvh; }

    @keyframes telaEntrada { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    [data-tela] { animation: telaEntrada 0.22s ease-out both; }
    .ativo { color: #38571A !important; }
    .ativo svg { stroke: #38571A !important; }

    ::-webkit-scrollbar { width: 3px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cddcb7; border-radius: 8px; }

    *:focus-visible { outline: 2px solid #D38301; outline-offset: 2px; border-radius: 4px; }

    .badge { display: inline-flex; align-items: center; padding: 0.15rem 0.6rem; border-radius: 9999px; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.02em; }
    .badge-verde { background: #e6eedb; color: #38571A; }
    .badge-laranja { background: #fdf0d5; color: #995e01; }
    .badge-vermelho { background: #fde8e8; color: #991b1b; }
    .badge-cinza { background: #f0f0f0; color: #555; }
    .badge-branco { background: rgba(255,255,255,0.2); color: #fff; }

    .card { background: #fff; border-radius: 1rem; box-shadow: 0 1px 8px rgba(0,0,0,0.06); padding: 1rem; margin-bottom: 0.75rem; transition: transform 0.15s ease, box-shadow 0.15s ease; }
    .card:hover { transform: translateY(-1px); box-shadow: 0 4px 16px rgba(0,0,0,0.1); }
    .card-interativa { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    .card-interativa:active { transform: scale(0.98); }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.65rem 1.25rem; border-radius: 9999px; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; font-size: 0.875rem; border: none; cursor: pointer; transition: transform 0.12s ease, box-shadow 0.2s ease, background-color 0.2s ease; text-decoration: none; white-space: nowrap; }
    .btn:active { transform: scale(0.95); }
    .btn-marca { background: #38571A; color: #fff; }
    .btn-marca:hover { background: #2d4515; box-shadow: 0 4px 16px rgba(56,87,26,0.3); }
    .btn-destaque { background: #D38301; color: #fff; }
    .btn-destaque:hover { background: #b87201; box-shadow: 0 4px 16px rgba(211,131,1,0.3); }
    .btn-outline { background: transparent; color: #38571A; border: 1.5px solid #cddcb7; }
    .btn-outline:hover { background: #f4f7f0; }
    .btn-ghost { background: transparent; color: #38571A; }
    .btn-ghost:hover { background: #f4f7f0; }
    .btn-branco { background: #fff; color: #38571A; }
    .btn-branco:hover { background: #f4f7f0; }
    .btn-sm { padding: 0.4rem 0.85rem; font-size: 0.8rem; }
    .btn-lg { padding: 0.8rem 2rem; font-size: 1rem; }
    .btn-w { width: 100%; }

    .toast-enter { animation: toastIn 0.28s ease-out both; }
    @keyframes toastIn { from { opacity: 0; transform: translateY(12px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
    @keyframes toastSair { from { opacity: 1; transform: translateY(0) scale(1); } to { opacity: 0; transform: translateY(-6px) scale(0.94); } }

    .modal-enter { animation: modalIn 0.2s ease-out both; }
    @keyframes modalIn { from { opacity: 0; transform: scale(0.94) translateY(8px); } to { opacity: 1; transform: scale(1) translateY(0); } }

    input:not([type="hidden"]):not([type="radio"]):not([type="checkbox"]), select, textarea {
      width: 100%; padding: 0.6rem 0.9rem; border: 1.5px solid #e5e7eb; border-radius: 0.6rem;
      font-family: 'DM Sans', system-ui, sans-serif; font-size: 0.9rem; color: #1f2937;
      background: #fff; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input:focus, select:focus, textarea:focus { border-color: #D38301; box-shadow: 0 0 0 3px rgba(211,131,1,0.1); outline: none; }
    input::placeholder, textarea::placeholder { color: #b0b0b0; }
    label.form-label { display: block; font-weight: 600; font-size: 0.8rem; color: #555; margin-bottom: 0.25rem; }
    .input-grupo { margin-bottom: 0.85rem; }

    .shadow-nav { box-shadow: 0 -4px 20px rgba(0,0,0,0.08); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }

    .grad-hero { background: linear-gradient(135deg, #38571A 0%, #4a7530 50%, #38571A 100%); }

    @media (max-width: 430px) { .moldura { border-radius: 0 !important; border: none !important; } .status-bar { display: none !important; } }
  </style>
</head>
<body>
  <div class="moldura" style="width:390px; max-width:100%; max-height:100dvh; height:100dvh; border-radius:2.2rem; border:3px solid #2a2a2e; overflow:hidden; background:#fafaf9; box-shadow:0 25px 80px rgba(0,0,0,0.5); display:flex; flex-direction:column; position:relative;">
    <div class="status-bar" style="background:#38571A; color:#fff; display:flex; align-items:center; justify-content:space-between; padding:0.35rem 1.4rem 0.25rem; flex-shrink:0;">
      <span style="font-size:0.8rem; font-weight:600;" id="relogio"></span>
      <span style="display:flex; align-items:center; gap:0.35rem;">
        <svg width="15" height="11" viewBox="0 0 15 11" fill="none"><rect x="0" y="5" width="2" height="6" rx="1" fill="white" opacity="0.4"/><rect x="4" y="3.5" width="2" height="7.5" rx="1" fill="white" opacity="0.6"/><rect x="8" y="1.5" width="2" height="9.5" rx="1" fill="white" opacity="0.8"/><rect x="12" y="0" width="2" height="11" rx="1" fill="white"/></svg>
        <svg width="14" height="10" viewBox="0 0 14 10" fill="none"><path d="M7 2.5C9.5 2.5 11.7 3.5 13.2 5.2L14 4.5C12.3 2.5 9.8 1.3 7 1.3C4.2 1.3 1.7 2.5 0 4.5L0.8 5.2C2.3 3.5 4.5 2.5 7 2.5Z" fill="white" opacity="0.9"/><circle cx="7" cy="6.5" r="1.5" fill="white"/><path d="M7 5C8.1 5 9 5.9 9 7C9 8.1 8.1 9 7 9C5.9 9 5 8.1 5 7C5 5.9 5.9 5 7 5Z" fill="white" opacity="0.35"/></svg>
        <svg width="24" height="11" viewBox="0 0 24 11" fill="none"><rect x="0.5" y="0.5" width="20" height="10" rx="2.5" stroke="white" stroke-opacity="0.35" fill="none"/><rect x="2" y="2" width="16" height="7" rx="1.5" fill="white"/><rect x="21" y="3" width="2.5" height="5" rx="1" fill="white" opacity="0.4"/><rect x="20" y="4.5" width="2.5" height="2" rx="0.5" fill="white" opacity="0.25"/></svg>
      </span>
    </div>

    <main style="flex:1; overflow-y:auto; overflow-x:hidden; -webkit-overflow-scrolling:touch; position:relative;" id="conteudo-app">
      <!-- TELAS -->
    </main>

    <nav style="background:#fff; border-top:1px solid #f0f0f0; display:flex; justify-content:space-around; align-items:center; padding:0.3rem 0.15rem 0; flex-shrink:0; box-shadow:0 -2px 12px rgba(0,0,0,0.06); padding-bottom: calc(0.3rem + env(safe-area-inset-bottom, 0px));" class="safe-bottom">
      <button data-nav="home-vitrine" onclick="mostrarTela('home-vitrine')" class="ativo" style="background:none; border:none; cursor:pointer; padding:0.3rem 0.2rem; display:flex; flex-direction:column; align-items:center; gap:0.15rem; min-width:52px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.75L12 3l9 6.75V20a2 2 0 01-2 2H5a2 2 0 01-2-2V9.75z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
        <span style="font-size:0.6rem; font-weight:500;">Home</span>
      </button>
      <button data-nav="vitrine-de-servicos" onclick="mostrarTela('vitrine-de-servicos')" style="background:none; border:none; cursor:pointer; padding:0.3rem 0.2rem; display:flex; flex-direction:column; align-items:center; gap:0.15rem; min-width:52px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        <span style="font-size:0.6rem; font-weight:500;">Serviços</span>
      </button>
      <button data-nav="agendamento" onclick="mostrarTela('agendamento')" style="background:none; border:none; cursor:pointer; padding:0.3rem 0.2rem; display:flex; flex-direction:column; align-items:center; gap:0.15rem; min-width:52px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2.5"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        <span style="font-size:0.6rem; font-weight:500;">Agenda</span>
      </button>
      <button data-nav="acompanhar-sessoes" onclick="mostrarTela('acompanhar-sessoes')" style="background:none; border:none; cursor:pointer; padding:0.3rem 0.2rem; display:flex; flex-direction:column; align-items:center; gap:0.15rem; min-width:52px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span style="font-size:0.6rem; font-weight:500;">Sessões</span>
      </button>
      <button data-nav="painel-administrativo" onclick="mostrarTela('painel-administrativo')" style="background:none; border:none; cursor:pointer; padding:0.3rem 0.2rem; display:flex; flex-direction:column; align-items:center; gap:0.15rem; min-width:52px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        <span style="font-size:0.6rem; font-weight:500;">Perfil</span>
      </button>
    </nav>
  </div>

  <div id="toasts" style="position:fixed; bottom:1.5rem; left:50%; transform:translateX(-50%); z-index:9999; display:flex; flex-direction:column; gap:0.5rem; align-items:center; pointer-events:none; max-width:390px; width:calc(100% - 2rem);"></div>
  <div id="modal" onclick="if(event.target===this)fecharModal()" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:8000; align-items:center; justify-content:center; padding:1.5rem;">
    <div id="modal-cartao" class="modal-enter" style="background:#fff; border-radius:1.25rem; max-width:370px; width:100%; max-height:75vh; display:flex; flex-direction:column; overflow:hidden;">
      <div style="display:flex; align-items:center; justify-content:space-between; padding:1.1rem 1.25rem 0.75rem; border-bottom:1px solid #f3f4f6;">
        <h3 id="modal-titulo" style="font-family:'Playfair Display',Georgia,serif; font-size:1.15rem; font-weight:600; color:#1f2937; margin:0;"></h3>
        <button onclick="fecharModal()" style="background:none; border:none; cursor:pointer; padding:0.25rem; color:#999; border-radius:50%; transition:background 0.15s;" onmouseover="this.style.background='#f3f4f6'" onmouseout="this.style.background='none'">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div id="modal-conteudo" style="padding:1.1rem 1.25rem; overflow-y:auto; flex:1;"></div>
    </div>
  </div>

  <script>
    function mostrarTela(id) {
      document.querySelectorAll('[data-tela]').forEach(function (s) { s.classList.toggle('hidden', s.dataset.tela !== id); });
      document.querySelectorAll('[data-nav]').forEach(function (b) { b.classList.toggle('ativo', b.dataset.nav === id); });
      document.getElementById('conteudo-app').scrollTop = 0;
    }

    var tms = null;
    function toast(msg, tipo) {
      var el = document.getElementById('toasts');
      var c = document.createElement('div');
      var bgs = { ok: '#38571A', erro: '#dc2626', info: '#2563eb' };
      var ico = { ok: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>', erro: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>', info: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>' };
      c.className = 'toast-enter';
      c.style.cssText = 'background:' + bgs[tipo] + '; color:#fff; padding:0.65rem 1rem; border-radius:9999px; font-size:0.82rem; font-weight:500; font-family:"DM Sans",system-ui,sans-serif; box-shadow:0 8px 24px rgba(0,0,0,0.18); display:flex; align-items:center; gap:0.5rem; pointer-events:auto; width:auto; max-width:100%;';
      c.innerHTML = ico[tipo] + '<span>' + msg + '</span>';
      el.appendChild(c);
      clearTimeout(tms);
      tms = setTimeout(function () { c.style.animation = 'toastSair 0.25s ease-in forwards'; setTimeout(function () { el.removeChild(c); }, 260); }, 3000);
    }

    function abrirModal(titulo, html) {
      document.getElementById('modal-titulo').textContent = titulo;
      document.getElementById('modal-conteudo').innerHTML = html;
      document.getElementById('modal').style.display = 'flex';
    }
    function fecharModal() { document.getElementById('modal').style.display = 'none'; }
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') fecharModal(); });

    function brl(v) { return 'R$ ' + Number(v).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function dataBR(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }

    (function () {
      var d = new Date();
      var h = d.getHours(); var m = d.getMinutes(); var s = 'AM';
      if (h >= 12) { h -= 12; s = ''; }
      if (h === 0) h = 12;
      document.getElementById('relogio').textContent = h + ':' + (m < 10 ? '0' : '') + m;
      mostrarTela('home-vitrine');
    })();
  </script>
</body>
</html>
